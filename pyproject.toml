[project]
name = "transitlos"
version = "1.0.0"
description = "Transit Level of Service (transitLOS): ties street-network accessibility, transit stops, and population/census data together into a single transit level-of-service accessibility score."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Miguel Ureña Pliego" }
]
dependencies = [
    "geohierarchy @ git+https://github.com/CityScope/geohierarchy.git",
    "pycensus @ git+https://github.com/CityScope/pyCensus.git",
    "pygtfshandler @ git+https://github.com/CityScope/pyGTFSHandler.git",
    "urbanaccessanalyzer @ git+https://github.com/CityScope/UrbanAccessAnalyzer.git",
    "polars>=1.0.0",
    "geopandas>=0.14.0",
    "pandas>=2.3.3",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "scipy>=1.11.0",
    "h3>=4.0.0",
    "h3ronpy>=0.21.0",
    "pyarrow>=14.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transitlos = ["i18n/*.json", "i18n/*.md", "flex/frontend/*"]

[project.optional-dependencies]
# GPU is OPTIONAL: nothing here is installed by default and every code path falls back to the CPU when CuPy / a CUDA device is missing (TRANSITLOS_DEVICE=cpu forces it).
gpu = ["cupy-cuda12x>=13.0"]
# RAPIDS (cuDF / cuGraph) is big and pins its own dependency versions: install it in a SEPARATE environment, e.g.
#   python -m venv .venv-rapids && .venv-rapids/bin/pip install cudf-cu12 cugraph-cu12 --extra-index-url=https://pypi.nvidia.com
# and point TRANSITLOS_RAPIDS_PYTHON at that environment's python; the pipeline calls it in a subprocess only when it exists.
rapids = ["cudf-cu12", "cugraph-cu12"]

[tool.hatch.metadata]
allow-direct-references = true   # the sibling packages are git dependencies (github.com/CityScope)
