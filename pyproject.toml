[project]
name = "transitlos"
version = "0.1.0"
description = "Transit Level of Service (transitLOS): ties street-network accessibility, transit stops, and population/census data together into a single transit level-of-service accessibility score."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Miguel Ureña Pliego" }
]
dependencies = [
    "geohierarchy",       # future: git+https://github.com/CityScope/geohierarchy.git
    "pycensus",            # future: git+https://github.com/CityScope/pyCensus.git
    "pygtfshandler",       # future: git+https://github.com/CityScope/pyGTFSHandler.git
    "urbanaccessanalyzer", # future: git+https://github.com/CityScope/UrbanAccessAnalyzer.git
    "polars>=1.0.0",
    "geopandas>=0.14.0",
    "pandas>=2.3.3",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "scipy>=1.11.0",
    "h3>=4.0.0",
    "h3ronpy>=0.21.0",
    "pyarrow>=14.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "pytest>=8.0.0",
]

[tool.uv.sources]
# Local editable path deps for now; swap to the git URLs noted above once
# these repos are stable/published and this package moves off local dev paths.
geohierarchy = { path = "../geohierarchy", editable = true }
pycensus = { path = "../pyCensus", editable = true }
pygtfshandler = { path = "../pyGTFSHandler", editable = true }
urbanaccessanalyzer = { path = "../UrbanAccessAnalyzer", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
